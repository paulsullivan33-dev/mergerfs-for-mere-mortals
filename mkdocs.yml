site_name: MergerFS for Mere Mortals
site_description: Plain-language pooling for drives you already own. Branches and policies explained in ordinary words, a first pool mounted step by step, what happens when a drive fills or fails, making the pool permanent with fstab, tuning a live pool through its control interface, and the limits stated without varnish.
site_url: https://paulsullivan33-dev.github.io/mergerfs-for-mere-mortals/

